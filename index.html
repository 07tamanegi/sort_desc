<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整列機関室 ― 終わらないソートの実験室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF9;
    --panel: #FFFFFF;
    --panel-2: #F4F4F3;
    --line: #E4E4E1;
    --ink: #1E1E1C;
    --dim: #767671;
    --dim-2: #A5A59F;
    --accent: #2F6FED;
    --amber: #D99A1E;
    --green: #3F8F5E;
    --bar-idle: #DADAD5;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 32px 20px 60px;
    min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;}

  header{text-align:center;margin-bottom:24px;}
  .eyebrow{
    display:inline-block;
    font-family: var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--accent);
  }
  h1{
    font-weight:700;
    font-size:32px;
    letter-spacing:-.01em;
    margin:10px 0 8px;
  }
  h1 span{color:var(--accent);}
  .sub{color:var(--dim);font-size:13.5px;line-height:1.7;max-width:560px;margin:0 auto;}
  .session-clock{
    margin-top:14px;
    font-size:12.5px;
    color: var(--dim);
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .session-clock b{font-family: var(--font-mono); color: var(--ink); font-weight:600;}

  details.explainer{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:8px;
    padding: 4px 16px;
    margin-bottom: 14px;
  }
  details.explainer summary{
    cursor:pointer;
    font-weight:600;
    font-size:13.5px;
    color: var(--ink);
    padding: 12px 0;
    list-style: none;
  }
  details.explainer summary::-webkit-details-marker{display:none;}
  .explain-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap:10px;
    padding-bottom: 14px;
  }
  .explain-card{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius:6px;
    padding: 10px 12px;
    cursor:pointer;
    transition: background-color .15s ease;
  }
  .explain-card:hover{ background: #ECECE9; }
  .explain-card:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; }
  .explain-card .ec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .explain-card .ec-name{font-size:13px;font-weight:600;color:var(--ink);}
  .explain-card .ec-complexity{font-family: var(--font-mono);font-size:10px;color: var(--accent);white-space:nowrap;}
  .explain-card p{margin:5px 0 0;font-size:11.5px;line-height:1.6;color:var(--dim);}
  .explain-card .ec-more{margin:7px 0 0;font-size:10.5px;color:var(--accent);}

  /* legend */
  .legend{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    font-size:11.5px;
    color: var(--dim);
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:8px;
    padding:13px 18px;
    margin-bottom: 16px;
    font-size:12.5px;
  }
  .controls label{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;}
  select{
    background: var(--panel-2);
    color: var(--ink);
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    font-family: var(--font-mono);
    font-size:12px;
  }
  input[type=range]{accent-color:var(--accent);}
  button{
    font-weight:600;
    font-size:13px;
    border:1px solid var(--accent);
    border-radius:6px;
    padding:8px 16px;
    cursor:pointer;
    background: var(--accent);
    color: #FFFFFF;
    transition: opacity .1s ease;
  }
  button:hover{ opacity:.9; }
  button.secondary{background:transparent;color:var(--accent);}
  button.chip{
    font-weight:500;
    font-size:11.5px;
    padding:5px 12px;
    border-radius:14px;
    border:1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
  }
  button.chip.on{ border-color: var(--accent); color: var(--accent); background: rgba(47,111,237,.08); }

  .algo-toggles{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin-bottom:16px;
  }

  /* leaderboard */
  .leaderboard{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:8px;
    padding: 13px 16px;
    margin-bottom: 16px;
  }
  .leaderboard h2{
    font-weight:600;
    font-size:14px;
    margin:0 0 10px;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  .leaderboard .hint{font-size:10.5px;color:var(--dim-2);font-weight:400;}
  .lb-row{
    display:grid;
    grid-template-columns: 24px 130px 1fr 92px;
    align-items:center;
    gap:10px;
    height:24px;
    margin-bottom:5px;
  }
  .lb-rank{font-family: var(--font-mono);font-weight:700;font-size:12px;color:var(--accent);text-align:center;}
  .lb-name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
  .lb-swatch{width:8px;height:8px;border-radius:2px;flex:none;}
  .lb-track{position:relative;height:10px;background: var(--panel-2);border-radius:5px;overflow:hidden;}
  .lb-fill{height:100%;width:0%;border-radius:5px;transition:width .3s ease;}
  .lb-val{font-family: var(--font-mono);font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;}
  .lb-empty{font-size:11.5px;color:var(--dim-2);padding:6px 0;}

  /* panel grid */
  .panels{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap:12px;
  }
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:8px;
    padding: 14px 14px 10px;
    position:relative;
    transition: border-color .2s ease;
  }
  .panel.focused{
    grid-column: 1 / -1;
  }
  .panel.flash{
    border-color: var(--green);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    cursor:pointer;
    margin-bottom:8px;
  }
  .panel-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--dim-2);
    flex:none;
  }
  .dot.running{ background: var(--green); }
  .panel-name-btn{
    display:flex;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    min-width:0;
    font:inherit;
  }
  .panel-name{
    font-weight:600;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color: var(--ink);
  }
  .panel-name-btn:hover .panel-name{ color: var(--accent); }
  .panel-name-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  .info-dot{
    flex:none;
    width:14px;height:14px;
    border-radius:50%;
    border:1px solid var(--dim-2);
    color: var(--dim-2);
    font-family: var(--font-mono);
    font-size:9px;
    line-height:12px;
    text-align:center;
    background:none;
    padding:0;
    cursor:pointer;
    display:inline-block;
    vertical-align:middle;
    position:relative;
  }
  .info-dot::before{
    content:'';
    position:absolute;
    inset:-8px;
  }
  .info-dot:hover{ border-color: var(--accent); color: var(--accent); }
  .modal th .info-dot{ margin-left:4px; }
  .stat .lbl .info-dot{ margin-left:3px; }
  tr.term-note td{ background: var(--panel-2); }
  .panel-name-btn:hover .info-dot{ border-color: var(--accent); color: var(--accent); }
  .panel-complexity{
    font-family: var(--font-mono);
    font-size:10px;
    color: var(--accent);
    white-space:nowrap;
    flex:none;
  }
  .loop-text{
    font-family: var(--font-mono);
    font-size:12.5px;
    font-weight:700;
    color: var(--ink);
  }
  .panel-loop{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }

  .bars{
    height: 120px;
    display:flex;
    align-items:flex-end;
    gap:1px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius:5px;
    padding: 4px;
    margin-bottom:6px;
  }
  .panel.focused .bars{ height:220px; }
  .bars i{
    display:block;
    flex:1;
    background: var(--bar-idle);
    border-radius: 1px 1px 0 0;
    transition: background-color .08s ease;
  }
  .bars i.hl-compare{ background: var(--accent) !important; }
  .bars i.hl-swap{ background: var(--amber) !important; }
  .bars i.hl-write{ background: var(--green) !important; }

  .progress{
    height:4px;
    background: var(--panel-2);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .progress-fill{height:100%;width:0%;background: var(--accent);transition: width .12s linear;}

  .stat-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:8px;
    margin-bottom:8px;
  }
  .stat{
    background: var(--panel-2);
    border-radius:5px;
    padding: 6px 8px;
  }
  .stat .lbl{font-size:9.5px;color:var(--dim-2);letter-spacing:.02em;}
  .stat .val{font-family: var(--font-mono);font-size:13.5px;font-weight:700;color:var(--ink);}
  .stat.speed .val{color: var(--accent);}
  .stat.avg .val{color: var(--accent);}

  .spark{
    width:100%;
    height:28px;
    display:block;
  }
  .spark path{fill:none;stroke-width:1.5;}

  footer{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    line-height:1.8;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
    color: var(--dim);
  }
  footer .sign{ display:block; margin-top:6px; color: var(--dim-2); }

  /* ---- detail modal ---- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(20,20,18,.55);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 5vh 16px;
    z-index: 100;
    opacity:0;
    pointer-events:none;
    transition: opacity .15s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    max-width: 700px;
    width:100%;
    max-height: 88vh;
    overflow-y:auto;
    padding: 28px 28px 30px;
    position:relative;
  }
  .modal-close{
    position:sticky;
    float:right;
    top:0;
    background: var(--panel-2);
    border:1px solid var(--line);
    color: var(--dim);
    width:28px;height:28px;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    padding:0;
    cursor:pointer;
  }
  .modal-close:hover{ color: var(--ink); border-color: var(--dim); }
  .detail-badge{
    display:inline-block;
    font-family: var(--font-mono);
    font-size:10.5px;
    padding:3px 9px;
    border-radius:12px;
    margin-bottom:8px;
  }
  .modal h2{
    font-weight:700;
    font-size:22px;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .detail-lead{
    color: var(--dim);
    font-size:13px;
    line-height:1.8;
    margin: 0 0 18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .modal h3{
    font-weight:600;
    font-size:14.5px;
    color: var(--ink);
    margin: 22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .modal h3::before{
    content:'';
    width:3px;height:13px;
    background: var(--accent);
    border-radius:2px;
    display:inline-block;
  }
  .modal p{ font-size:13px; line-height:1.85; color: var(--ink); margin: 0 0 10px; }
  .modal ol, .modal ul{ margin: 0 0 10px; padding-left: 20px; }
  .modal li{ font-size:13px; line-height:1.85; color: var(--ink); margin-bottom:6px; }
  .modal table{ width:100%; border-collapse:collapse; font-size:12.5px; margin: 4px 0 14px; }
  .modal th, .modal td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  .modal th{ color: var(--dim); font-weight:500; font-family: var(--font-mono); font-size:11px; }
  .modal td{ color: var(--ink); }
  .modal td.mono, .modal th.mono{ font-family: var(--font-mono); }
  .example-box{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 12px 14px;
    font-size:13px;
    line-height:1.85;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .example-box .arr{ font-family: var(--font-mono); color: var(--accent); }
  .analogy-box{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 15px 12px;
    font-size:13px;
    line-height:1.85;
    color: var(--ink);
    margin: 12px 0 4px;
  }

  @media (max-width:560px){
    h1{font-size:24px;}
    .panels{grid-template-columns: 1fr;}
    .stat-grid{grid-template-columns: repeat(2,1fr);}
    .lb-row{grid-template-columns: 18px 90px 1fr 68px; gap:6px;}
    .controls{flex-direction:column;align-items:stretch;}
    .controls label{justify-content:space-between;}
    .modal{padding:20px 18px 24px;}
    .modal h2{font-size:19px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ソート</h1>
    <div class="sub">日常のデータの整理に必須なソートをわかりやすく、実際に体験できるサイトを作りました。色々調整できるのでぜひ試してみてください。</div>
    <div class="session-clock">
      <span>眺め始めてから <b id="sessionClock">0:00</b></span>
      <span>完了した周回 <b id="totalLoops">0</b>回</span>
    </div>
  </header>

  <details class="explainer">
    <summary>体感できるソートは10種類 ― タップすると仕組みのメモが読めます</summary>
    <div class="explain-grid" id="explainGrid"></div>
  </details>

  <div class="legend">
    <span><i style="background:var(--bar-idle)"></i>まだ触ってない</span>
    <span><i style="background:var(--accent)"></i>比べてる</span>
    <span><i style="background:var(--amber)"></i>入れ替えた</span>
    <span><i style="background:var(--green)"></i>書き込んだ</span>
    <span style="color:var(--dim-2)">下の折れ線は、直近の速さのゆらぎ</span>
  </div>

  <div class="controls">
    <label>並べる数
      <select id="sizeSel">
        <option value="16">16</option>
        <option value="24" selected>24</option>
        <option value="32">32</option>
        <option value="48">48</option>
      </select>
    </label>
    <label>見る速さ <span id="speedVal">6</span>
      <input type="range" id="speedRange" min="0.1" max="20" step="0.1" value="6">
    </label>
    <button id="pauseBtn">一時停止 ⏸</button>
    <button id="resetBtn" class="secondary">記録をやり直す</button>
  </div>

  <div class="algo-toggles" id="algoToggles"></div>

  <div class="leaderboard">
    <h2>だいたいの速さくらべ（平均タイム）<span class="hint">見出しをクリックすると大きく表示</span></h2>
    <div id="lbRows"><div class="lb-empty">まだ記録なし。ひと周りしたら、ここに並びます。</div></div>
  </div>

  <div class="panels" id="panels"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <button class="modal-close" id="modalClose" aria-label="閉じる">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const ALGORITHMS = [
  { key:'bubble',    name:'バブルソート',     color:'#E4572E',
    complexity:'O(n²)', desc:'隣り合う要素を比較し、順番が逆なら交換する操作をひたすら繰り返す。仕組みは単純だが比較回数が多く低速。' },
  { key:'selection', name:'選択ソート',       color:'#4C9F70',
    complexity:'O(n²)', desc:'未整列部分から最小値を探し、先頭と入れ替える。比較回数は多いが交換回数は少なめ。' },
  { key:'insertion', name:'挿入ソート',       color:'#3E9BD3',
    complexity:'O(n²)', desc:'整列済み部分に新しい要素を正しい位置まで挿し込んでいく。ほぼ整列済みのデータには強い。' },
  { key:'quick',     name:'クイックソート',   color:'#E29A2E',
    complexity:'平均O(n log n)', desc:'基準値（ピボット）より小さい/大きいグループに分割していく分割統治法。平均は非常に速いが運が悪いと崩れる。' },
  { key:'merge',     name:'マージソート',     color:'#8A6FD8',
    complexity:'O(n log n)', desc:'配列を半分に割って再帰的に整列し、最後に統合（マージ）する。常に安定した速さを出す優等生。' },
  { key:'heap',      name:'ヒープソート',     color:'#C96A4C',
    complexity:'O(n log n)', desc:'配列をヒープ構造に組み替え、最大値を取り出しては並べ替える。常に安定して速いが定数負荷はやや重め。' },
  { key:'shell',     name:'シェルソート',     color:'#2FA8B8',
    complexity:'O(n log²n)程度', desc:'挿入ソートを一定間隔（ギャップ）で先に行い、徐々に間隔を狭めていく改良版。' },
  { key:'comb',      name:'コムソート',       color:'#B06A2E',
    complexity:'O(n log n)程度', desc:'バブルソートの改良版で、比較する間隔を徐々に狭めながら交換していく。' },
  { key:'cocktail',  name:'コクテールソート', color:'#3E9E6E',
    complexity:'O(n²)', desc:'バブルソートを左右交互（双方向）に行う方式。大小どちらの偏りにもやや強いが根本は低速。' },
  { key:'gnome',     name:'ノームソート',     color:'#C15B7A',
    complexity:'O(n²)', desc:'挿入ソートに近い仕組みで、要素を1つずつ前後に動かしながら整列する素朴な方法。' },
];

// ---- long-form explanations, shown in the detail modal ----
const DETAILS = {
  bubble: `
    <p class="detail-lead">隣り合う要素を比較して、順番が逆なら交換する。これをひたすら端まで繰り返すだけの、もっとも素朴なソート。1回のパスが終わるたびに、未整列部分の中で最大の値が末尾に「泡のように浮かび上がる」ことからこの名がついた。</p>
    <h3>仕組み</h3>
    <ol>
      <li>配列の先頭から、隣り合う2つの要素を比較する</li>
      <li>順番が逆（左＞右）なら、その場で2つを入れ替える</li>
      <li>1つ右へ進み、また隣同士を比較する。これを末尾まで繰り返す（＝1パス）</li>
      <li>1パス終えるごとに、その時点での最大値が正しい末尾位置に確定する。次のパスでは対象範囲を1つ縮める</li>
      <li>交換が1回も起きないパスがあれば、その時点で整列済みとみなして終了できる（早期終了）</li>
    </ol>
    <h3>具体例で追ってみる</h3>
    <div class="example-box">

// ---- generators: each yields an action describing what just happened ----
function* bubbleSort(a){
  for(let i=0;i<a.length-1;i++){
    for(let j=0;j<a.length-1-i;j++){
      yield {type:'compare', i:j, j:j+1};
      if(a[j]>a[j+1]){ [a[j],a[j+1]]=[a[j+1],a[j]]; yield {type:'swap', i:j, j:j+1}; }
    }
  }
}
function* selectionSort(a){
  for(let i=0;i<a.length-1;i++){
    let min=i;
    for(let j=i+1;j<a.length;j++){ yield {type:'compare', i:min, j:j}; if(a[j]<a[min]) min=j; }
    if(min!==i){ [a[i],a[min]]=[a[min],a[i]]; yield {type:'swap', i:i, j:min}; }
  }
}
function* insertionSort(a){
  for(let i=1;i<a.length;i++){
    let j=i;
    while(j>0 && a[j-1]>a[j]){ [a[j-1],a[j]]=[a[j],a[j-1]]; yield {type:'swap', i:j-1, j:j}; j--; }
    yield {type:'compare', i:Math.max(j-1,0), j:j};
  }
}
function* quickSort(a, lo=0, hi=a.length-1){
  if(lo>=hi) return;
  const pivot=a[hi]; let i=lo;
  for(let j=lo;j<hi;j++){
    yield {type:'compare', i:j, j:hi};
    if(a[j]<pivot){ [a[i],a[j]]=[a[j],a[i]]; i++; yield {type:'swap', i:i-1, j:j}; }
  }
  [a[i],a[hi]]=[a[hi],a[i]]; yield {type:'swap', i:i, j:hi};
  yield* quickSort(a, lo, i-1);
  yield* quickSort(a, i+1, hi);
}
function* mergeSort(a, lo=0, hi=a.length-1){
  if(lo>=hi) return;
  const mid=(lo+hi)>>1;
  yield* mergeSort(a, lo, mid);
  yield* mergeSort(a, mid+1, hi);
  const left=a.slice(lo,mid+1), right=a.slice(mid+1,hi+1);
  let i=0,j=0,k=lo;
  while(i<left.length && j<right.length){
    yield {type:'compare', i:k, j:k};
    a[k] = (left[i] <= right[j]) ? left[i++] : right[j++];
    yield {type:'write', i:k, j:k};
    k++;
  }
  while(i<left.length){ a[k]=left[i++]; yield {type:'write', i:k, j:k}; k++; }
  while(j<right.length){ a[k]=right[j++]; yield {type:'write', i:k, j:k}; k++; }
}
function* heapSort(a){
  const n=a.length;
  function* heapify(size,i){
    let largest=i, l=2*i+1, r=2*i+2;
    yield {type:'compare', i:i, j:l<size?l:i};
    if(l<size && a[l]>a[largest]) largest=l;
    if(r<size && a[r]>a[largest]) largest=r;
    if(largest!==i){ [a[i],a[largest]]=[a[largest],a[i]]; yield {type:'swap', i:i, j:largest}; yield* heapify(size,largest); }
  }
  for(let i=Math.floor(n/2)-1;i>=0;i--) yield* heapify(n,i);
  for(let i=n-1;i>0;i--){ [a[0],a[i]]=[a[i],a[0]]; yield {type:'swap', i:0, j:i}; yield* heapify(i,0); }
}
function* shellSort(a){
  const n = a.length;
  for(let gap = Math.floor(n/2); gap > 0; gap = Math.floor(gap/2)){
    for(let i = gap; i < n; i++){
      const temp = a[i];
      let j = i;
      while(j >= gap){
        yield {type:'compare', i:j-gap, j:j};
        if(a[j-gap] > temp){
          a[j] = a[j-gap];
          yield {type:'write', i:j, j:j-gap};
          j -= gap;
        }else break;
      }
      a[j] = temp;
      yield {type:'write', i:j, j:j};
    }
  }
}
function* combSort(a){
  const n = a.length;
  let gap = n, shrink = 1.3, sorted = false;
  while(!sorted){
    gap = Math.floor(gap/shrink);
    if(gap <= 1){ gap = 1; sorted = true; }
    for(let i=0; i+gap<n; i++){
      yield {type:'compare', i:i, j:i+gap};
      if(a[i] > a[i+gap]){ [a[i],a[i+gap]]=[a[i+gap],a[i]]; yield {type:'swap', i:i, j:i+gap}; sorted = false; }
    }
  }
}
function* cocktailSort(a){
  const n = a.length;
  let start = 0, end = n-1, swapped = true;
  while(swapped){
    swapped = false;
    for(let i=start; i<end; i++){
      yield {type:'compare', i:i, j:i+1};
      if(a[i] > a[i+1]){ [a[i],a[i+1]]=[a[i+1],a[i]]; yield {type:'swap', i:i, j:i+1}; swapped = true; }
    }
    end--;
    if(!swapped) break;
    swapped = false;
    for(let i=end; i>start; i--){
      yield {type:'compare', i:i-1, j:i};
      if(a[i-1] > a[i]){ [a[i-1],a[i]]=[a[i],a[i-1]]; yield {type:'swap', i:i-1, j:i}; swapped = true; }
    }
    start++;
  }
}
function* gnomeSort(a){
  const n = a.length;
  let i = 0;
  while(i < n){
    if(i === 0){ i++; continue; }
    yield {type:'compare', i:i-1, j:i};
    if(a[i-1] <= a[i]){ i++; }
    else{ [a[i-1],a[i]]=[a[i],a[i-1]]; yield {type:'swap', i:i-1, j:i}; i--; }
  }
}
const BUILDERS = {
  bubble: bubbleSort, selection: selectionSort, insertion: insertionSort,
  quick: quickSort, merge: mergeSort, heap: heapSort,
  shell: shellSort, comb: combSort, cocktail: cocktailSort, gnome: gnomeSort
};

    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openStatDetail(btn.dataset.stat);
    });
  });
  panel.querySelector('.panel-head').addEventListener('click', ()=>{
    focusedKey = (focusedKey === def.key) ? null : def.key;
    buildPanels();
  });
  return panel;
}

function buildPanels(){
  panelsEl.innerHTML = '';
  const order = ALGORITHMS.filter(a=>active.has(a.key));
  order.forEach(def=>{
    if(!runners[def.key]) runners[def.key] = makeRunner(def);
    const panel = panelTemplate(def);
    if(def.key === focusedKey) panel.classList.add('focused');
    panelsEl.appendChild(panel);
    const r = runners[def.key];
    r.els = {
      panel,
      dot: panel.querySelector('.dot'),
      loopLabel: panel.querySelector('.loop-text'),
      bars: panel.querySelector('.bars'),
      progressFill: panel.querySelector('.progress-fill'),
      elapsed: panel.querySelector('.elapsed'),
      sps: panel.querySelector('.sps'),
      stepsEl: panel.querySelector('.steps'),
      avgEl: panel.querySelector('.avg'),
      spark: panel.querySelector('.spark path'),
    };
    r.els.bars.innerHTML = r.arr.map(()=> '<i></i>').join('');
  });
  // remove runners for deactivated algorithms to free memory
  Object.keys(runners).forEach(k=>{
    if(!active.has(k)) delete runners[k];
  });
}

function fmtTime(ms){
  const s = ms/1000;
  return s.toFixed(1) + 's';
}
function fmtClock(ms){
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m + ':' + String(s).padStart(2,'0');
}

function renderRunner(r, now){
  const max = arraySize;
  const bars = r.els.bars.children;
  for(let i=0;i<r.arr.length;i++){
    if(bars[i]){
      bars[i].style.height = (r.arr[i]/max*100) + '%';
      bars[i].classList.remove('hl-compare','hl-swap','hl-write');
    }
  }
  if(r.lastAction){
    const cls = r.lastAction.type==='swap' ? 'hl-swap' : (r.lastAction.type==='write' ? 'hl-write' : 'hl-compare');
    if(bars[r.lastAction.i]) bars[r.lastAction.i].classList.add(cls);
    if(bars[r.lastAction.j]) bars[r.lastAction.j].classList.add(cls);
  }
  let correct = 0;
  for(let i=0;i<r.arr.length;i++) if(r.arr[i]===i+1) correct++;
  const progress = correct / r.arr.length;
  r.els.progressFill.style.width = Math.round(progress*100) + '%';

  const elapsedMs = now - r.loopStart;
  const sps = elapsedMs > 0 ? (r.steps / (elapsedMs/1000)) : 0;
  r.els.elapsed.textContent = fmtTime(elapsedMs);
  r.els.sps.textContent = Math.round(sps).toLocaleString();
  r.els.stepsEl.textContent = r.steps.toLocaleString();
  r.els.avgEl.textContent = r.avgTime !== null ? fmtTime(r.avgTime) : '—';
  r.els.loopLabel.textContent = r.loopCount + '周目';
  r.els.dot.classList.toggle('running', !paused);

  if(now - r.lastSampleAt > 150){
    r.lastSampleAt = now;
    r.speedSamples.push(sps);
    if(r.speedSamples.length > 40) r.speedSamples.shift();
    const maxS = Math.max(1, ...r.speedSamples);
    const pts = r.speedSamples.map((v,idx)=>{
      const x = (idx/(Math.max(1,r.speedSamples.length-1)))*200;
      const y = 30 - (v/maxS)*28 - 1;
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    r.els.spark.setAttribute('d', pts.length ? 'M'+pts.replace(/ /g,' L') : '');
  }
}

function stepRunner(r, baseRate, now){
  r.momentum += baseRate;
  while(r.momentum >= 1){
    const res = r.gen.next();
    r.momentum -= 1;
    if(res.done){
      const loopMs = now - r.loopStart;
      r.loopCount++;
      r.totalTime += loopMs;
      r.avgTime = r.totalTime / r.loopCount;
      r.lastTime = loopMs;
      if(r.els){
        r.els.panel.classList.add('flash');
        setTimeout(()=> r.els.panel && r.els.panel.classList.remove('flash'), 500);
      }
      // reshuffle and restart immediately — endless loop
      r.arr = newArray(arraySize);
      r.gen = BUILDERS[r.def.key](r.arr);
      r.steps = 0;
      r.momentum = 0;
      r.loopStart = now;
      r.lastAction = null;
      if(r.els){ r.els.bars.innerHTML = r.arr.map(()=> '<i></i>').join(''); }
      updateLeaderboard();
      break;
    }
    r.steps++;
    r.lastAction = res.value;
  }
}

function updateLeaderboard(){
  const ranked = Object.values(runners)
    .filter(r=>r.avgTime !== null)
    .sort((a,b)=> a.avgTime - b.avgTime);
  let totalLoops = 0;
  Object.values(runners).forEach(r=> totalLoops += r.loopCount);
  totalLoopsEl.textContent = totalLoops.toLocaleString();
  if(!ranked.length){
    lbRows.innerHTML = '<div class="lb-empty">まだ記録なし。ひと周りしたら、ここに並びます。</div>';
    return;
  }
  const slowest = ranked[ranked.length-1].avgTime;
  lbRows.innerHTML = ranked.map((r,idx)=>{
    const pct = Math.max(4, Math.round((1 - r.avgTime/slowest) * 96) + 4);
    return `
      <div class="lb-row">
        <div class="lb-rank">${idx+1}</div>
        <div class="lb-name"><span class="lb-swatch" style="background:${r.def.color}"></span>${r.def.name}</div>
        <div class="lb-track"><div class="lb-fill" style="width:${pct}%;background:${r.def.color}"></div></div>
        <div class="lb-val">${fmtTime(r.avgTime)} / ${r.loopCount}周</div>
      </div>`;
  }).join('');
}

function resetStats(){
  Object.values(runners).forEach(r=>{
    r.loopCount = 0;
    r.totalTime = 0;
    r.avgTime = null;
    r.lastTime = null;
    r.speedSamples = [];
  });
  sessionStart = performance.now();
  updateLeaderboard();
}

speedRange.addEventListener('input', ()=>{ speedVal.textContent = parseFloat(speedRange.value).toFixed(1).replace(/\.0$/,''); });
sizeSel.addEventListener('change', ()=>{
  arraySize = parseInt(sizeSel.value,10);
  Object.keys(runners).forEach(k=> delete runners[k]);
  buildPanels();
  updateLeaderboard();
});
pauseBtn.addEventListener('click', ()=>{
  paused = !paused;
  pauseBtn.textContent = paused ? 'また動かす ▶' : '一時停止 ⏸';
});
resetBtn.addEventListener('click', resetStats);

function mainLoop(){
  const now = performance.now();
  if(!paused){
    const baseRate = parseFloat(speedRange.value);
    Object.values(runners).forEach(r=>{
      if(!r.els) return;
      stepRunner(r, baseRate, now);
      renderRunner(r, now);
    });
  }
  sessionClockEl.textContent = fmtClock(now - sessionStart);
  requestAnimationFrame(mainLoop);
}

buildToggles();
buildPanels();
updateLeaderboard();
requestAnimationFrame(mainLoop);
</script>
</body>
</html>
